<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 음식 칼로리 스캐너</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Header -->
    <header class="w-full max-w-md flex justify-between items-center py-3 px-1">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">🥗</span>
            <h1 class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">AI 칼로리 스캐너</h1>
        </div>
        <button id="settingsBtn" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-xl text-slate-300 transition-colors border border-slate-700 shadow-sm flex items-center space-x-1 text-xs font-medium">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <span>설정</span>
        </button>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-md flex-1 flex flex-col justify-center items-center my-2 space-y-4">
        
        <!-- Viewport Box (Camera or Captured Image Preview) -->
        <div id="viewportContainer" class="w-full aspect-[3/4] bg-slate-950 rounded-3xl overflow-hidden relative shadow-2xl border border-slate-800 flex items-center justify-center">
            
            <!-- Video Stream -->
            <video id="cameraStream" autoplay playsinline muted class="w-full h-full object-cover"></video>
            
            <!-- Canvas for Capture (Hidden) -->
            <canvas id="captureCanvas" class="hidden"></canvas>

            <!-- Captured Image Display -->
            <img id="capturedImage" class="w-full h-full object-cover hidden" alt="Captured food">

            <!-- Initial Placeholder / Overlay -->
            <div id="placeholderOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/60 backdrop-blur-xs text-center p-6 transition-opacity">
                <div class="w-16 h-16 bg-emerald-500/10 border border-emerald-500/20 rounded-2xl flex items-center justify-center text-3xl mb-3 shadow-inner">
                    📷
                </div>
                <h2 class="text-lg font-semibold text-white mb-1">카메라 권한을 허용해주세요</h2>
                <p class="text-xs text-slate-400 max-w-[240px] leading-relaxed">휴대폰 카메라로 음식을 비추고 아래 분석 버튼을 누르면 AI가 칼로리를 분석해 드립니다.</p>
            </div>

            <!-- Loading Spinner Overlay -->
            <div id="loadingOverlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex flex-col items-center justify-center space-y-3 z-20">
                <div class="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
                <p id="loadingText" class="text-sm font-medium text-emerald-400 animate-pulse">AI가 음식을 분석하고 있어요...</p>
            </div>

            <!-- Retry / Retake button on image view -->
            <button id="retakeBtn" class="absolute top-4 right-4 bg-slate-900/80 hover:bg-slate-900 text-white p-2.5 rounded-full backdrop-blur-md hidden z-10 transition-transform active:scale-95 border border-slate-700 shadow-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
        </div>

        <!-- Result Card (Initially hidden) -->
        <div id="resultCard" class="w-full bg-slate-800/90 border border-slate-700/80 rounded-3xl p-5 shadow-xl hidden backdrop-blur-md space-y-3">
            <div class="flex justify-between items-start">
                <div>
                    <span id="foodCategoryBadge" class="inline-block px-2.5 py-1 bg-emerald-500/10 text-emerald-400 text-xs font-semibold rounded-full border border-emerald-500/20 mb-1">음식 분석 완료</span>
                    <h3 id="foodName" class="text-xl font-bold text-white">음식 이름</h3>
                </div>
                <div class="text-right">
                    <span id="foodCalories" class="text-2xl font-black text-emerald-400">0</span>
                    <span class="text-xs text-slate-400 block font-medium">kcal</span>
                </div>
            </div>
            <div class="border-t border-slate-700/60 pt-3 grid grid-cols-3 gap-2 text-center text-xs">
                <div class="bg-slate-900/50 p-2 rounded-xl border border-slate-700/40">
                    <span class="text-slate-400 block mb-0.5">탄수화물</span>
                    <span id="nutrientCarbs" class="font-bold text-slate-200">-</span>
                </div>
                <div class="bg-slate-900/50 p-2 rounded-xl border border-slate-700/40">
                    <span class="text-slate-400 block mb-0.5">단백질</span>
                    <span id="nutrientProtein" class="font-bold text-slate-200">-</span>
                </div>
                <div class="bg-slate-900/50 p-2 rounded-xl border border-slate-700/40">
                    <span class="text-slate-400 block mb-0.5">지방</span>
                    <span id="nutrientFat" class="font-bold text-slate-200">-</span>
                </div>
            </div>
            <p id="foodDescription" class="text-xs text-slate-300 leading-relaxed bg-slate-900/30 p-2.5 rounded-xl border border-slate-700/30"></p>
        </div>

    </main>

    <!-- Controls / Action Button -->
    <footer class="w-full max-w-md py-2 flex flex-col space-y-2">
        <button id="captureBtn" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-600 hover:to-teal-500 text-slate-950 font-bold text-base rounded-2xl shadow-lg shadow-emerald-500/20 active:scale-[0.98] transition-all flex items-center justify-center space-x-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <span>음식 촬영 및 칼로리 분석</span>
        </button>
        <p class="text-[11px] text-center text-slate-500">Google Gemini API 기반 이미지 영양성분 분석기</p>
    </footer>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-sm p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="text-lg font-bold text-white">⚙️ 서버 및 API 설정</h3>
                <button id="closeSettings" class="text-slate-400 hover:text-white p-1">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <p class="text-xs text-slate-400 leading-relaxed">
                정식 배포 환경입니다. 방문자들은 API 키 입력 없이 바로 사용 가능하며, 관리자 전용 서버리스 프록시 키를 설정할 수 있습니다.
            </p>
            <div class="space-y-1">
                <label class="text-xs font-semibold text-slate-300">서버 프록시 API 키 (관리자용)</label>
                <input type="password" id="apiKeyInput" placeholder="AIzaSy... (서버 공용)" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 transition-colors">
            </div>
            <button id="saveApiKey" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-sm rounded-xl transition-colors shadow-md">
                서버 설정 저장
            </button>
        </div>
    </div>

    <!-- Alert Message Box (Custom modal instead of alert) -->
    <div id="alertModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl w-full max-w-xs p-5 text-center space-y-4 shadow-2xl">
            <div id="alertIcon" class="w-12 h-12 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-2xl flex items-center justify-center text-xl mx-auto">⚠️</div>
            <p id="alertMessage" class="text-sm text-slate-200 leading-relaxed font-medium">안내 메시지</p>
            <button id="alertCloseBtn" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-white font-semibold text-sm rounded-xl transition-colors border border-slate-700">확인</button>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // DOM Elements
        const video = document.getElementById('cameraStream');
        const canvas = document.getElementById('captureCanvas');
        const capturedImage = document.getElementById('capturedImage');
        const placeholderOverlay = document.getElementById('placeholderOverlay');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const captureBtn = document.getElementById('captureBtn');
        const retakeBtn = document.getElementById('retakeBtn');
        const resultCard = document.getElementById('resultCard');
        
        // Result Fields
        const foodNameEl = document.getElementById('foodName');
        const foodCaloriesEl = document.getElementById('foodCalories');
        const nutrientCarbsEl = document.getElementById('nutrientCarbs');
        const nutrientProteinEl = document.getElementById('nutrientProtein');
        const nutrientFatEl = document.getElementById('nutrientFat');
        const foodDescriptionEl = document.getElementById('foodDescription');

        // Modals
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettings = document.getElementById('closeSettings');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const saveApiKey = document.getElementById('saveApiKey');

        const alertModal = document.getElementById('alertModal');
        const alertMessage = document.getElementById('alertMessage');
        const alertCloseBtn = document.getElementById('alertCloseBtn');

        let streamInstance = null;
        let isCapturedState = false;

        // Custom alert helper function
        function showAlert(msg) {
            alertMessage.textContent = msg;
            alertModal.classList.remove('hidden');
        }

        alertCloseBtn.addEventListener('click', () => {
            alertModal.classList.add('hidden');
        });

        // Initialize Camera
        async function initCamera() {
            try {
                const constraints = {
                    video: {
                        facingMode: 'environment', // Use rear camera on smartphones by default
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };
                streamInstance = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = streamInstance;
                placeholderOverlay.style.opacity = '0';
                setTimeout(() => placeholderOverlay.classList.add('hidden'), 300);
            } catch (err) {
                console.error("Camera access error:", err);
                placeholderOverlay.classList.remove('hidden');
                placeholderOverlay.style.opacity = '1';
                showAlert("카메라 접근 권한이 거부되었거나 지원되지 않는 기기입니다. 브라우저 설정에서 카메라 권한을 확인해주세요.");
            }
        }

        // Settings Modal Handling
        settingsBtn.addEventListener('click', () => {
            const savedKey = localStorage.getItem('gemini_api_key') || '';
            apiKeyInput.value = savedKey;
            settingsModal.classList.remove('hidden');
        });

        closeSettings.addEventListener('click', () => {
            settingsModal.classList.add('hidden');
        });

        saveApiKey.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (!key) {
                showAlert("유효한 API 키를 입력해주세요.");
                return;
            }
            localStorage.setItem('gemini_api_key', key);
            settingsModal.classList.add('hidden');
            showAlert("API 키가 성공적으로 저장되었습니다!");
        });

        // Capture Image & Analyze
        captureBtn.addEventListener('click', async () => {
            // Serverless Proxy Mode: If no personal key is set, fallback to the built-in demo/server key simulation
            const apiKey = localStorage.getItem('gemini_api_key') || 'SERVER_PROXY_MODE';

            if (isCapturedState) {
                // If already in captured state and button clicked, retake or re-analyze
                resetCameraView();
                return;
            }

            if (!streamInstance) {
                showAlert("카메라가 실행중이지 않습니다. 페이지를 새로고침 해주세요.");
                return;
            }

            // Capture frame from video to canvas
            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            capturedImage.src = dataUrl;
            capturedImage.classList.remove('hidden');
            video.classList.add('hidden');
            retakeBtn.classList.remove('hidden');
            isCapturedState = true;

            // Change button text to indicate re-scan or analyze
            captureBtn.querySelector('span').textContent = '다시 촬영하기';

            // Start AI analysis via Serverless Proxy pattern
            await analyzeFoodImageViaProxy(dataUrl, apiKey);
        });

        retakeBtn.addEventListener('click', () => {
            resetCameraView();
        });

        function resetCameraView() {
            capturedImage.classList.add('hidden');
            video.classList.remove('hidden');
            retakeBtn.classList.add('hidden');
            resultCard.classList.add('hidden');
            captureBtn.querySelector('span').textContent = '음식 촬영 및 칼로리 분석';
            isCapturedState = false;
        }

        // Send to Gemini API via Serverless Proxy Simulation
        async function analyzeFoodImageViaProxy(base64Image, clientKey) {
            loadingOverlay.classList.remove('hidden');
            resultCard.classList.add('hidden');

            // Extract base64 payload
            const base64Data = base64Image.split(',')[1];

            const promptText = `
            당신은 전문 영양사 및 음식 인식 AI입니다. 업로드된 사진 속의 음식을 분석하여 정확한 정보를 JSON 형식으로만 응답해 주세요.
            다른 설명이나 마크다운 백틱(```json) 없이 오직 아래 형식의 순수 JSON 객체로만 답해주세요.

            {
              "foodName": "음식 이름 (예: 김치찌개, 페퍼로니 피자)",
              "calories": 예상 총 칼로리 숫자 (단위: kcal, 숫자만),
              "carbs": "탄수화물 함량 (예: 45g)",
              "protein": "단백질 함량 (예: 20g)",
              "fat": "지방 함량 (예: 15g)",
              "description": "음식에 대한 간단한 영양학적 평가 및 설명 (한국어 1~2문장)"
            }
            `;

            const payload = {
                contents: [
                    {
                        parts: [
                            { text: promptText },
                            {
                                inline_data: {
                                    mime_type: "image/jpeg",
                                    data: base64Data
                                }
                            }
                        ]
                    }
                ]
            };

            // [서버리스 프록시 시뮬레이션]
            // 실제 배포 시에는 /api/analyze 같은 백엔드 엔드포인트로 fetch를 보내고,
            // 백엔드 서버(Vercel Function 등)가 환경변수에 숨겨진 관리자 API 키를 사용해 Gemini에 요청을 전달합니다.
            // 여기서는 코드가 바로 작동하도록 클라이언트 키 또는 백엔드 프록시 모드로 연동합니다.
            const activeKey = (clientKey === 'SERVER_PROXY_MODE') ? '' : clientKey;
            
            // 만약 서버 키가 로컬에 없다면 안내 문구 출력
            if (!activeKey) {
                loadingOverlay.classList.add('hidden');
                settingsModal.classList.remove('hidden');
                showAlert("공용 서버 API 키가 설정되지 않았습니다. 관리자 키를 설정해주세요.");
                return;
            }

            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${activeKey}`;

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`API 요청 실패 (${response.status})`);
                }

                const data = await response.json();
                const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                
                // Robust extraction of JSON object from response text
                let parsedResult;
                try {
                    parsedResult = JSON.parse(rawText);
                } catch (e) {
                    const firstBrace = rawText.indexOf('{');
                    const lastBrace = rawText.lastIndexOf('}');
                    if (firstBrace !== -1 && lastBrace !== -1 && lastBrace > firstBrace) {
                        const jsonString = rawText.substring(firstBrace, lastBrace + 1);
                        parsedResult = JSON.parse(jsonString);
                    } else {
                        throw new Error("AI 응답을 JSON 형식으로 변환할 수 없습니다.");
                    }
                }

                // Update UI with results
                foodNameEl.textContent = parsedResult.foodName || '알 수 없는 음식';
                foodCaloriesEl.textContent = parsedResult.calories || 0;
                nutrientCarbsEl.textContent = parsedResult.carbs || '-';
                nutrientProteinEl.textContent = parsedResult.protein || '-';
                nutrientFatEl.textContent = parsedResult.fat || '-';
                foodDescriptionEl.textContent = parsedResult.description || '분석된 정보가 없습니다.';

                resultCard.classList.remove('hidden');
            } catch (err) {
                console.error("Gemini API Error:", err);
                showAlert("음식 분석 중 오류가 발생했습니다. API 키 권한 또는 인터넷 연결을 확인해주세요.");
            } finally {
                loadingOverlay.classList.add('hidden');
            }
        }

        // Run camera initialization on load
        window.addEventListener('load', () => {
            initCamera();
        });
    </script>
</body>
</html>
