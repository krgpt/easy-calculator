<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 음식 칼로리 스캐너</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Header -->
    <header class="w-full max-w-md flex justify-between items-center py-3 px-1">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">🥗</span>
            <h1 class="text-xl font-bold bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">AI 칼로리 스캐너</h1>
        </div>
        <button id="settingsBtn" class="bg-slate-800 hover:bg-slate-700 p-2 rounded-xl text-slate-300 transition-colors border border-slate-700 shadow-sm flex items-center space-x-1 text-xs font-medium">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            <span>설정</span>
        </button>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-md flex-1 flex flex-col justify-center items-center my-2 space-y-4">
        
        <!-- Viewport Box (Camera or Captured Image Preview) -->
        <div id="viewportContainer" class="w-full aspect-[3/4] bg-slate-950 rounded-3xl overflow-hidden relative shadow-2xl border border-slate-800 flex items-center justify-center">
            
            <!-- Video Stream -->
            <video id="cameraStream" autoplay playsinline muted class="w-full h-full object-cover"></video>
            
            <!-- Canvas for Capture (Hidden) -->
            <canvas id="captureCanvas" class="hidden"></canvas>

            <!-- File Upload Input (Hidden Fallback) -->
            <input type="file" id="imageUploadInput" accept="image/*" class="hidden">

            <!-- Captured Image Display -->
            <img id="capturedImage" class="w-full h-full object-cover hidden" alt="Captured food">

            <!-- Initial Placeholder / Overlay -->
            <div id="placeholderOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-950/60 backdrop-blur-xs text-center p-6 transition-opacity">
                <div class="w-16 h-16 bg-emerald-500/10 border border-emerald-500/20 rounded-2xl flex items-center justify-center text-3xl mb-3 shadow-inner">
                    📷
                </div>
                <h2 class="text-lg font-semibold text-white mb-1">카메라 권한을 허용해주세요</h2>
                <p class="text-xs text-slate-400 max-w-[240px] leading-relaxed">휴대폰 카메라로 음식을 비추고 아래 분석 버튼을 누르면 AI가 칼로리를 분석해 드립니다.</p>
            </div>

            <!-- Loading Spinner Overlay -->
            <div id="loadingOverlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex flex-col items-center justify-center space-y-3 z-20">
                <div class="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
                <p id="loadingText" class="text-sm font-medium text-emerald-400 animate-pulse">AI가 음식을 분석하고 있어요...</p>
            </div>

            <!-- Retry / Retake button on image view -->
            <button id="retakeBtn" class="absolute top-4 right-4 bg-slate-900/80 hover:bg-slate-900 text-white p-2.5 rounded-full backdrop-blur-md hidden z-10 transition-transform active:scale-95 border border-slate-700 shadow-lg">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m
