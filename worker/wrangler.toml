name = "easy-calculator-gemini"
main = "gemini-proxy.js"
compatibility_date = "2026-01-01"

# ------------------------------------------------------------------
# API 키는 절대 이 파일에 쓰지 마세요.
# 아래 명령으로 Secret(암호화)으로 등록합니다.
#   npx wrangler secret put GEMINI_API_KEY
# ------------------------------------------------------------------

[vars]
# 필요할 때만 주석을 해제해서 사용하세요.
# GEMINI_MODEL = "gemini-2.5-flash"
# ALLOWED_ORIGINS = "https://krgpt.github.io"
# RATE_LIMIT_PER_DAY = "30"

# ------------------------------------------------------------------
# (선택) 하루 요청 횟수 제한을 쓰려면 KV 네임스페이스를 만든 뒤
# 아래 주석을 해제하고 id를 채우세요.
#   npx wrangler kv namespace create RATE_LIMIT_KV
# ------------------------------------------------------------------
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "여기에_KV_ID"
